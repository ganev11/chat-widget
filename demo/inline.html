<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Chat widget demo — inline</title>
    <style>
        body { margin: 0; font-family: system-ui, sans-serif; background: #ececec; }
        .page { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: 1fr 420px; gap: 16px; }
        .content { background: #fff; border-radius: 10px; padding: 16px; }
        /* Inline mode fills its container: give the container a height. */
        #chat { height: calc(100vh - 32px); border-radius: 12px; overflow: hidden; border: 1px solid #ddd; }
        @media (max-width: 800px) { .page { grid-template-columns: 1fr; } #chat { height: 80vh; } }
    </style>
</head>
<body>
    <div class="page">
        <div class="content">
            <h2>Inline mode</h2>
            <p>The chat fills <code>#chat</code> instead of floating. Same options, same events.
               <a href="../index.html">Floating demo</a></p>
            <p>This one uses the <code>dark</code> preset with a custom primary colour.</p>
        </div>
        <div id="chat"></div>
    </div>
    <script type="module">
        import * as SSTChat from '/src/index.jsx';
        const q = new URLSearchParams(location.search);
        const apiKey = q.get('key') ?? import.meta.env.VITE_CHAT_API_KEY;
        if (apiKey) {
            SSTChat.init({
                apiKey,
                apiUrl: q.get('api') ?? import.meta.env.VITE_CHAT_API_URL ?? 'http://localhost:3005/v1',
                mode: 'inline',
                container: '#chat',
                language: q.get('lang') ?? 'es',
                theme: { preset: 'dark', primary: '#0f9d58' },
                onAction: (a) => console.info('[onAction]', a),
            });
        } else {
            document.getElementById('chat').textContent = 'Pass ?key=<public API key>';
        }
    </script>
</body>
</html>
